
{% extends "base.html" %}

{% block title %}Ожидание — QuizPL14{% endblock %}

{% block body_class %}page-player{% endblock %}

{% block content %}

<div class="player-wrapper">

    <div class="player-card" style="text-align:center">

        <div class="player-logo">
            <span class="logo-icon">⚡</span>
            <h1 class="logo-text">QuizPL14</h1>
        </div>

        <div style="margin-top:2rem">

            <div style="font-size:3rem">
                ⏳
            </div>

            <h2 style="margin-top:1rem">
                Ожидание игры
            </h2>

            <p style="color:var(--text-muted);margin-top:0.75rem">
                Ведущий скоро начнёт викторину.
            </p>

        </div>

        <a
            href="{{ url_for('game.join') }}"
            class="btn btn--ghost"
            style="margin-top:1.5rem"
        >
            ← На главную
        </a>

    </div>

</div>

{% endblock %}
